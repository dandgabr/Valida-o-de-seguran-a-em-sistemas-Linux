[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-audit-linux"
version = "1.0.0"
description = "Linux Security Assessment, Hardening and Compliance Automation Platform"
readme = "README.md"
authors = [{ name = "Security Engineering Team" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sec-audit-linux = "sec_audit_linux.interfaces.cli:main"
sec-audit-mcp = "sec_audit_linux.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
